[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-runtime"
version = "0.1.0"
description = "Project-scoped robot simulation service with a MuJoCo SO-101 backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/lihuigang/MuJoCo"
Issues = "https://github.com/lihuigang/MuJoCo/issues"

[project.optional-dependencies]
mujoco = ["mujoco>=3.1.3"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
simulation-runtime = "simulation_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"simulation_runtime.backends.mujoco_so101" = ["assets/**/*"]
"simulation_runtime.service" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mujoco: requires the optional MuJoCo runtime",
    "integration: starts a real HTTP server",
]
